<!-- =========================
         LOGIN PAGE
    ========================== -->
<section id="loginPage" class="auth-page hidden">

    <div class="auth-side">

        <h2>Welcome back to WorkZone.</h2>

        <p>Log in to check your applications, saved jobs and new openings.</p>

        <ul class="auth-points">
            <li><svg class="icon"><use href="#i-check" /></svg>Track every application</li>
            <li><svg class="icon"><use href="#i-check" /></svg>Keep a list of saved jobs</li>
            <li><svg class="icon"><use href="#i-check" /></svg>Know when your status changes</li>
        </ul>

    </div>

    <div class="auth-main">

        <div class="auth-card">

            <h1>Log in</h1>

            <p class="auth-subtitle">Use the email you signed up with.</p>

            <form onsubmit="login(event)">

                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input class="form-control" id="loginEmail" type="email" placeholder="you@email.com"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input class="form-control" id="loginPassword" type="password" placeholder="Your password"
                        autocomplete="current-password" required>
                </div>

                <button class="btn btn-primary full-width">Log in</button>

            </form>

            <p class="auth-switch">
                New to WorkZone?
                <a onclick="showPage('register')">Create an account</a>
            </p>

        </div>

    </div>

</section>
