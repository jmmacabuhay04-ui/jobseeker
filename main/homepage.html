<!-- =========================
         HOME PAGE
    ========================== -->
<main id="homePage">

    <section class="hero">

        <div class="container hero-content">

            <h1 class="display">Find work that fits you.</h1>

            <p class="hero-lede">
                Browse openings from local employers, save the ones you like,
                and track every application in one place.
            </p>

            <div class="search-box" role="search">

                <label class="search-field">
                    <svg class="icon"><use href="#i-search" /></svg>
                    <input type="text" id="homeKeyword" placeholder="Job title, skill or company"
                        aria-label="Keyword" onkeydown="if (event.key === 'Enter') searchFromHome()">
                </label>

                <label class="search-field">
                    <svg class="icon"><use href="#i-pin" /></svg>
                    <input type="text" id="homeLocation" placeholder="City or province" aria-label="Location"
                        onkeydown="if (event.key === 'Enter') searchFromHome()">
                </label>

                <select id="homeCategory" aria-label="Category">
                    <option value="">All categories</option>
                    <option value="IT">Information Technology</option>
                    <option value="Design">Design</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Finance">Finance</option>
                    <option value="Education">Education</option>
                </select>

                <button class="btn btn-primary search-btn" onclick="searchFromHome()">
                    Search jobs
                </button>

            </div>

            <div class="hero-tags">
                <span>Popular:</span>
                <button onclick="quickSearch('Web Developer')">Web developer</button>
                <button onclick="quickSearch('Internship')">Internship</button>
                <button onclick="quickSearch('Remote')">Remote</button>
                <button onclick="quickSearch('Design')">Design</button>
            </div>

        </div>

        <div class="hazard" aria-hidden="true"></div>

    </section>


    <!-- STATISTICS -->

    <section class="stats-section">

        <div class="container stats">

            <div class="stat-card">
                <h2 id="homeJobCount">0</h2>
                <p>Open jobs</p>
            </div>

            <div class="stat-card">
                <h2 id="homeCompanyCount">0</h2>
                <p>Hiring companies</p>
            </div>

            <div class="stat-card">
                <h2 id="homeApplicantCount">0</h2>
                <p>Job categories</p>
            </div>

            <div class="stat-card">
                <h2>Free</h2>
                <p>For job seekers</p>
            </div>

        </div>

    </section>


    <!-- FEATURED JOBS -->

    <section class="section">

        <div class="container">

            <div class="section-header">

                <h2>Latest openings</h2>

                <button class="btn btn-outline" onclick="showPage('jobs')">
                    See all jobs
                </button>

            </div>

            <div id="featuredJobs" class="job-grid">
            </div>

        </div>

    </section>

</main>
