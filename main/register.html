<!-- =========================
         REGISTER PAGE
    ========================== -->
<section id="registerPage" class="auth-page hidden">

    <div class="auth-side">

        <h2>Your career starts here.</h2>

        <p>Looking for work? Sign up as a job seeker. Hiring? Sign up as an employer and post your first opening.</p>

        <ul class="auth-points">
            <li><svg class="icon"><use href="#i-check" /></svg>Free for job seekers</li>
            <li><svg class="icon"><use href="#i-check" /></svg>Apply in a few clicks</li>
            <li><svg class="icon"><use href="#i-check" /></svg>Post jobs and review applicants</li>
        </ul>

    </div>

    <div class="auth-main">

        <div class="auth-card">

            <h1>Create account</h1>

            <p class="auth-subtitle">It's free and takes a minute.</p>

            <form onsubmit="register(event)">

                <div class="form-group">
                    <label for="registerName">Full name</label>
                    <input class="form-control" id="registerName" placeholder="Juan Dela Cruz" autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input class="form-control" id="registerEmail" type="email" placeholder="you@email.com"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input class="form-control" id="registerPassword" type="password" minlength="6"
                        placeholder="At least 6 characters" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="registerRole">I'm signing up as</label>
                    <select class="form-control" id="registerRole">
                        <option value="seeker">Job seeker</option>
                        <option value="employer">Employer</option>
                    </select>
                </div>

                <button class="btn btn-primary full-width">Create account</button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a onclick="showPage('login')">Log in</a>
            </p>

        </div>

    </div>

</section>
