<!-- =========================
         JOB DETAILS MODAL
    ========================== -->

<div id="jobModal" class="modal hidden">

    <div class="modal-box">

        <button class="modal-close" onclick="closeModal()">

            ×

        </button>


        <span class="section-label">
            JOB DETAILS
        </span>


        <h2 id="modalTitle">
            Job Title
        </h2>


        <p id="modalCompany" class="modal-company">
        </p>


        <div class="modal-info">

            <span id="modalLocation">
            </span>

            <span id="modalSalary">
            </span>

            <span id="modalType">
            </span>

        </div>


        <hr>


        <h3>
            Job Description
        </h3>

        <p id="modalDescription">
        </p>


        <h3>
            Required Skills
        </h3>

        <div id="modalSkills" class="tags">
        </div>


        <div class="modal-actions">

            <button class="btn btn-primary" onclick="applyFromModal()">

                Apply Now

            </button>


            <button class="btn btn-secondary" onclick="saveCurrentJob()">

                ⭐ Save Job

            </button>

        </div>

    </div>

</div>
