<!-- =========================
         JOB DETAILS MODAL
    ========================== -->

<div id="jobModal" class="modal hidden" onclick="if (event.target === this) closeModal()">

    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <button class="modal-close" onclick="closeModal()" aria-label="Close">
            <svg class="icon"><use href="#i-x" /></svg>
        </button>

        <p id="modalCompany" class="modal-company"></p>

        <h2 id="modalTitle">Job title</h2>

        <div class="modal-info">
            <span id="modalLocation"></span>
            <span id="modalSalary"></span>
            <span id="modalType"></span>
        </div>

        <h3>About the job</h3>

        <p id="modalDescription"></p>

        <h3>Skills needed</h3>

        <div id="modalSkills" class="tags"></div>

        <div class="modal-actions">

            <button class="btn btn-primary" onclick="applyFromModal()">Apply now</button>

            <button id="modalSaveBtn" class="btn btn-secondary" onclick="saveCurrentJob()">Save job</button>

        </div>

    </div>

</div>
