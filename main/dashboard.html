<!-- =========================
         DASHBOARD
    ========================== -->
<section id="dashboardPage" class="page hidden">

    <div class="container dashboard">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-user">

                <div class="avatar">
                    👤
                </div>

                <div>
                    <strong id="sidebarName">
                        User
                    </strong>

                    <small id="sidebarRole">
                        Work Zone
                    </small>
                </div>

            </div>


            <button class="sidebar-link active" onclick="dashboardTab('overview', this)">

                📊
                Overview

            </button>


            <button class="sidebar-link" onclick="dashboardTab('profile', this)">

                👤
                My Profile

            </button>


            <button class="sidebar-link" onclick="dashboardTab('applications', this)">

                📋
                Applications

            </button>


            <button class="sidebar-link" onclick="dashboardTab('saved', this)">

                ⭐
                Saved Jobs

            </button>


            <button id="employerMenu" class="sidebar-link hidden" onclick="dashboardTab('employer', this)">

                💼
                Employer

            </button>


            <!-- ADMIN ONLY -->

            <button id="adminMenu" class="sidebar-link hidden" onclick="showManageApplications(this)">

                ✅
                Manage Applications

            </button>

        </aside>


        <!-- DASHBOARD CONTENT -->

        <div class="dashboard-content">

            <!-- OVERVIEW -->

            <div id="tabOverview" class="dashboard-tab">

                <div class="dashboard-heading">

                    <div>

                        <span class="section-label">
                            DASHBOARD
                        </span>

                        <h1>
                            Welcome,
                            <span id="dashboardName">
                                User
                            </span>!
                        </h1>

                    </div>

                    <button class="btn btn-primary" onclick="showPage('jobs')">

                        Find Jobs

                    </button>

                </div>


                <div class="dashboard-stats">

                    <div class="dashboard-stat">

                        <span>📋</span>

                        <div>
                            <h2 id="dashApplications">
                                0
                            </h2>

                            <p>
                                Applications
                            </p>
                        </div>

                    </div>


                    <div class="dashboard-stat">

                        <span>⭐</span>

                        <div>
                            <h2 id="dashSaved">
                                0
                            </h2>

                            <p>
                                Saved Jobs
                            </p>
                        </div>

                    </div>


                    <div class="dashboard-stat">

                        <span>💼</span>

                        <div>
                            <h2 id="dashPosted">
                                0
                            </h2>

                            <p>
                                Jobs Posted
                            </p>
                        </div>

                    </div>

                </div>

            </div>


            <!-- PROFILE -->

            <div id="tabProfile" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>
                        My Profile
                    </h2>

                    <form onsubmit="saveProfile(event)">

                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Full Name
                                </label>

                                <input class="form-control" id="profileName" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Email
                                </label>

                                <input class="form-control" id="profileEmail" type="email" required>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Phone
                                </label>

                                <input class="form-control" id="profilePhone" placeholder="+63...">

                            </div>


                            <div class="form-group">

                                <label>
                                    Skills
                                </label>

                                <input class="form-control" id="profileSkills" placeholder="HTML, CSS, JavaScript">

                            </div>

                        </div>


                        <div class="form-group">

                            <label>
                                Education
                            </label>

                            <textarea class="form-control" id="profileEducation" rows="4"
                                placeholder="Your education"></textarea>

                        </div>


                        <div class="form-group">

                            <label>
                                Work Experience
                            </label>

                            <textarea class="form-control" id="profileExperience" rows="4"
                                placeholder="Your work experience"></textarea>

                        </div>


                        <button class="btn btn-primary">
                            Save Profile
                        </button>

                    </form>

                </div>

            </div>


            <!-- APPLICATIONS -->

            <div id="tabApplications" class="dashboard-tab hidden">

                <div class="panel">

                    <div class="panel-heading">

                        <h2>
                            My Applications
                        </h2>

                    </div>

                    <div id="applicationTable">
                    </div>

                </div>

            </div>


            <!-- SAVED JOBS -->

            <div id="tabSaved" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>
                        Saved Jobs
                    </h2>

                    <div id="savedJobList" class="job-grid">
                    </div>

                </div>

            </div>


            <!-- EMPLOYER -->

            <div id="tabEmployer" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>
                        Post a Job
                    </h2>


                    <form onsubmit="postJob(event)">

                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Job Title
                                </label>

                                <input class="form-control" id="postTitle" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Company
                                </label>

                                <input class="form-control" id="postCompany" required>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Location
                                </label>

                                <input class="form-control" id="postLocation" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Salary
                                </label>

                                <input class="form-control" id="postSalary" placeholder="₱30,000 - ₱50,000" required>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label>
                                    Category
                                </label>

                                <select class="form-control" id="postCategory">

                                    <option value="IT">
                                        IT
                                    </option>

                                    <option value="Design">
                                        Design
                                    </option>

                                    <option value="Marketing">
                                        Marketing
                                    </option>

                                    <option value="Finance">
                                        Finance
                                    </option>

                                    <option value="Education">
                                        Education
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label>
                                    Employment Type
                                </label>

                                <select class="form-control" id="postType">

                                    <option>
                                        Full Time
                                    </option>

                                    <option>
                                        Part Time
                                    </option>

                                    <option>
                                        Remote
                                    </option>

                                    <option>
                                        Internship
                                    </option>

                                </select>

                            </div>

                        </div>


                        <div class="form-group">

                            <label>
                                Skills
                            </label>

                            <input class="form-control" id="postSkills" placeholder="HTML, CSS, JavaScript" required>

                        </div>


                        <div class="form-group">

                            <label>
                                Job Description
                            </label>

                            <textarea class="form-control" id="postDescription" rows="5" required></textarea>

                        </div>


                        <button class="btn btn-primary">
                            Publish Job
                        </button>

                    </form>

                </div>


                <div class="panel">

                    <h2>
                        My Posted Jobs
                    </h2>

                    <div id="postedJobs">
                    </div>

                </div>

            </div>


            <!-- MANAGE APPLICATIONS (ADMIN) -->

            <div id="tabManage" class="dashboard-tab hidden">

                <div class="panel">

                    <div class="panel-heading">

                        <h2>
                            Manage Applications
                        </h2>

                    </div>

                    <div id="manageTable">
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
