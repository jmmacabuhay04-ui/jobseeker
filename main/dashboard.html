<!-- =========================
         DASHBOARD
    ========================== -->
<section id="dashboardPage" class="page hidden">

    <div class="container dashboard">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-user">

                <div class="avatar">
                    <svg class="icon"><use href="#i-user" /></svg>
                </div>

                <div>
                    <strong id="sidebarName">User</strong>
                    <small id="sidebarRole">Job seeker</small>
                </div>

            </div>

            <button class="sidebar-link active" onclick="dashboardTab('overview', this)">
                <svg class="icon"><use href="#i-grid" /></svg>
                Overview
            </button>

            <button class="sidebar-link" onclick="dashboardTab('profile', this)">
                <svg class="icon"><use href="#i-user" /></svg>
                My profile
            </button>

            <button id="seekerApplicationsMenu" class="sidebar-link" onclick="dashboardTab('applications', this)">
                <svg class="icon"><use href="#i-file" /></svg>
                My applications
            </button>

            <button id="seekerSavedMenu" class="sidebar-link" onclick="dashboardTab('saved', this)">
                <svg class="icon"><use href="#i-star" /></svg>
                Saved jobs
            </button>

            <button id="employerMenu" class="sidebar-link hidden" onclick="dashboardTab('employer', this)">
                <svg class="icon"><use href="#i-plus" /></svg>
                Post a job
            </button>

            <!-- ADMIN / EMPLOYER -->

            <button id="adminMenu" class="sidebar-link hidden" onclick="showManageApplications(this)">
                <svg class="icon"><use href="#i-check" /></svg>
                Applicants
            </button>

        </aside>


        <!-- DASHBOARD CONTENT -->

        <div class="dashboard-content">

            <!-- OVERVIEW -->

            <div id="tabOverview" class="dashboard-tab">

                <div class="dashboard-heading">

                    <div>
                        <span class="kicker">Dashboard</span>
                        <h1>Hi, <span id="dashboardName">User</span></h1>
                    </div>

                    <button class="btn btn-primary" onclick="showPage('jobs')">
                        <svg class="icon"><use href="#i-search" /></svg>
                        Find jobs
                    </button>

                </div>

                <div class="dashboard-stats">

                    <div class="dashboard-stat">
                        <span class="feature-icon"><svg class="icon"><use href="#i-file" /></svg></span>
                        <div>
                            <h2 id="dashApplications">0</h2>
                            <p>Applications</p>
                        </div>
                    </div>

                    <div class="dashboard-stat">
                        <span class="feature-icon"><svg class="icon"><use href="#i-star" /></svg></span>
                        <div>
                            <h2 id="dashSaved">0</h2>
                            <p>Saved jobs</p>
                        </div>
                    </div>

                    <div class="dashboard-stat">
                        <span class="feature-icon"><svg class="icon"><use href="#i-briefcase" /></svg></span>
                        <div>
                            <h2 id="dashPosted">0</h2>
                            <p>Jobs posted</p>
                        </div>
                    </div>

                </div>

            </div>


            <!-- PROFILE -->

            <div id="tabProfile" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>My profile</h2>

                    <form onsubmit="saveProfile(event)">

                        <div class="form-row">

                            <div class="form-group">
                                <label for="profileName">Full name</label>
                                <input class="form-control" id="profileName" required>
                            </div>

                            <div class="form-group">
                                <label for="profileEmail">Email</label>
                                <input class="form-control" id="profileEmail" type="email" required>
                                <p class="form-hint">Email can't be changed here.</p>
                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label for="profilePhone">Phone</label>
                                <input class="form-control" id="profilePhone" placeholder="+63 9XX XXX XXXX">
                            </div>

                            <div class="form-group">
                                <label for="profileSkills">Skills</label>
                                <input class="form-control" id="profileSkills" placeholder="HTML, CSS, JavaScript">
                                <p class="form-hint">Separate skills with commas.</p>
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="profileEducation">Education</label>
                            <textarea class="form-control" id="profileEducation" rows="4"
                                placeholder="School, course and year"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="profileExperience">Work experience</label>
                            <textarea class="form-control" id="profileExperience" rows="4"
                                placeholder="Past jobs, internships or projects"></textarea>
                        </div>

                        <button class="btn btn-primary">Save profile</button>

                    </form>

                </div>

            </div>


            <!-- APPLICATIONS -->

            <div id="tabApplications" class="dashboard-tab hidden">

                <div class="panel">

                    <div class="panel-heading">
                        <h2>My applications</h2>
                    </div>

                    <div id="applicationTable">
                    </div>

                </div>

            </div>


            <!-- SAVED JOBS -->

            <div id="tabSaved" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>Saved jobs</h2>

                    <div id="savedJobList" class="job-grid">
                    </div>

                </div>

            </div>


            <!-- EMPLOYER -->

            <div id="tabEmployer" class="dashboard-tab hidden">

                <div class="panel">

                    <h2>Post a job</h2>

                    <form onsubmit="postJob(event)">

                        <div class="form-row">

                            <div class="form-group">
                                <label for="postTitle">Job title</label>
                                <input class="form-control" id="postTitle" placeholder="e.g. Junior Web Developer"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="postCompany">Company</label>
                                <input class="form-control" id="postCompany" required>
                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label for="postLocation">Location</label>
                                <input class="form-control" id="postLocation" placeholder="e.g. Makati City" required>
                            </div>

                            <div class="form-group">
                                <label for="postSalary">Salary</label>
                                <input class="form-control" id="postSalary" placeholder="₱30,000 – ₱50,000" required>
                            </div>

                        </div>

                        <div class="form-row">

                            <div class="form-group">
                                <label for="postCategory">Category</label>
                                <select class="form-control" id="postCategory">
                                    <option value="IT">IT</option>
                                    <option value="Design">Design</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Finance">Finance</option>
                                    <option value="Education">Education</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="postType">Employment type</label>
                                <select class="form-control" id="postType">
                                    <option value="Full Time">Full time</option>
                                    <option value="Part Time">Part time</option>
                                    <option value="Remote">Remote</option>
                                    <option value="Internship">Internship</option>
                                </select>
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="postSkills">Skills needed</label>
                            <input class="form-control" id="postSkills" placeholder="HTML, CSS, JavaScript" required>
                            <p class="form-hint">Separate skills with commas.</p>
                        </div>

                        <div class="form-group">
                            <label for="postDescription">Job description</label>
                            <textarea class="form-control" id="postDescription" rows="5" required></textarea>
                        </div>

                        <button class="btn btn-primary">Publish job</button>

                    </form>

                </div>

                <div class="panel">

                    <h2>My posted jobs</h2>

                    <div id="postedJobs">
                    </div>

                </div>

            </div>


            <!-- MANAGE APPLICATIONS (ADMIN / EMPLOYER) -->

            <div id="tabManage" class="dashboard-tab hidden">

                <div class="panel">

                    <div class="panel-heading">
                        <h2>Applicants</h2>
                    </div>

                    <div id="manageTable">
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
