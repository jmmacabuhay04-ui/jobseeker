<!-- =========================
         JOBS PAGE
    ========================== -->
<section id="jobsPage" class="page hidden">

    <div class="container">

        <div class="page-heading">

            <h1 class="display">Find your next job</h1>

            <p>Filter by keyword, place, category or schedule. Results update as you type.</p>

        </div>


        <div class="filter-box">

            <div class="filter-grid">

                <div>
                    <label for="filterKeyword">Keyword</label>
                    <input class="form-control" id="filterKeyword" placeholder="e.g. React, cashier, nurse"
                        oninput="filterJobs()">
                </div>

                <div>
                    <label for="filterLocation">Location</label>
                    <input class="form-control" id="filterLocation" placeholder="e.g. Manila" oninput="filterJobs()">
                </div>

                <div>
                    <label for="filterCategory">Category</label>
                    <select class="form-control" id="filterCategory" onchange="filterJobs()">
                        <option value="">All categories</option>
                        <option value="IT">IT</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Finance">Finance</option>
                        <option value="Education">Education</option>
                    </select>
                </div>

                <div>
                    <label for="filterType">Employment type</label>
                    <select class="form-control" id="filterType" onchange="filterJobs()">
                        <option value="">All types</option>
                        <option value="Full Time">Full time</option>
                        <option value="Part Time">Part time</option>
                        <option value="Remote">Remote</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>

            </div>

            <button class="btn btn-secondary" onclick="clearFilters()">
                Clear filters
            </button>

        </div>

        <p id="resultCount" class="result-count"></p>

        <div id="allJobs" class="job-grid">
        </div>

    </div>

</section>
