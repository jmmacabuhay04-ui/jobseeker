<!-- =========================
         JOBS PAGE
    ========================== -->
<section id="jobsPage" class="page hidden">

    <div class="container">

        <div class="page-heading">

            <span class="section-label">
                OPPORTUNITIES
            </span>

            <h1>
                Find Your Next Job
            </h1>

            <p>
                Search and filter available job opportunities.
            </p>

        </div>


        <div class="filter-box">

            <div class="filter-grid">

                <div>

                    <label>
                        Keyword
                    </label>

                    <input class="form-control" id="filterKeyword" placeholder="Search jobs..." oninput="filterJobs()">

                </div>


                <div>

                    <label>
                        Location
                    </label>

                    <input class="form-control" id="filterLocation" placeholder="e.g. Manila" oninput="filterJobs()">

                </div>


                <div>

                    <label>
                        Category
                    </label>

                    <select class="form-control" id="filterCategory" onchange="filterJobs()">

                        <option value="">
                            All Categories
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Design">
                            Design
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Education">
                            Education
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Employment Type
                    </label>

                    <select class="form-control" id="filterType" onchange="filterJobs()">

                        <option value="">
                            All Types
                        </option>

                        <option value="Full Time">
                            Full Time
                        </option>

                        <option value="Part Time">
                            Part Time
                        </option>

                        <option value="Remote">
                            Remote
                        </option>

                        <option value="Internship">
                            Internship
                        </option>

                    </select>

                </div>

            </div>


            <button class="btn btn-secondary" onclick="clearFilters()">

                Clear Filters

            </button>

        </div>


        <div id="allJobs" class="job-grid">
        </div>

    </div>

</section>
